name: GitOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  BACKEND_IMAGE_NAME: shuttle-backend
  FRONTEND_IMAGE_NAME: shuttle-frontend
  NAMESPACE: campus-shuttle

jobs:
  # =========================================================
  # STAGE 1: TEST & LINT
  # =========================================================
  test-and-lint:
    name: "Stage 1: Test & Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio httpx
          pip install -r backend/requirements.txt

      - name: Code Quality & Linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Concurrency & Unit Tests
        run: |
          python -m pytest backend/tests/ -v

  # =========================================================
  # STAGE 2: BUILD & PUSH DOCKER IMAGES
  # =========================================================
  build-and-push:
    name: "Stage 2: Build & Push"
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

  # =========================================================
  # STAGE 3: DEPLOY (K8S ROLLING UPDATE)
  # =========================================================
  deploy:
    name: "Stage 3: Automated K8s Deploy"
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Dry Run & Validate Manifests
        run: |
          kubectl apply --dry-run=client -f k8s/namespace.yaml
          kubectl apply --dry-run=client -f k8s/postgres-pvc.yaml
          kubectl apply --dry-run=client -f k8s/postgres-deployment.yaml
          kubectl apply --dry-run=client -f k8s/redis-deployment.yaml
          kubectl apply --dry-run=client -f k8s/backend-deployment.yaml
          kubectl apply --dry-run=client -f k8s/backend-hpa.yaml
          kubectl apply --dry-run=client -f k8s/frontend-deployment.yaml
          kubectl apply --dry-run=client -f k8s/ingress.yaml
          echo "All Kubernetes manifests successfully validated!"
