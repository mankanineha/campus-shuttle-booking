server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver needed for proxy_pass to external HTTPS hosts (Render services)
    resolver 8.8.8.8 8.8.4.4 valid=30s;
    resolver_timeout 10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy — BACKEND_URL is replaced at container startup via envsubst
    # proxy_ssl_server_name enables SNI, required for HTTPS upstreams like Render
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_ssl_server_name on;
    }

    location /metrics {
        proxy_pass ${BACKEND_URL}/metrics;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
    }
}
