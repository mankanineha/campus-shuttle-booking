databases:
  - name: shuttle-postgres
    databaseName: shuttle_db
    user: shuttle_user
    plan: free

services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: shuttle-redis
    plan: free
    ipAllowList: []          # only internal access

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: campus-hopper-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shuttle-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: shuttle-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: shuttle-redis
          type: redis
          property: port
      - key: POD_NAME
        value: render-pod-1
      - key: POD_IP
        value: 0.0.0.0

  # ── Frontend (Nginx) ───────────────────────────────────────────────────────
  # NOTE: After backend deploys, copy its public URL (e.g. https://campus-hopper-backend.onrender.com)
  # and set it as BACKEND_URL env var on this service in the Render dashboard.
  - type: web
    name: campus-hopper-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: BACKEND_URL
        sync: false          # you will fill this in the Render dashboard after backend deploys
